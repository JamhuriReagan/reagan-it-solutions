<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Reagan's IT</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a3a4f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 28px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { color: #f97316; font-size: 1.8rem; }
        .logo p { color: #666; font-size: 0.9rem; }
        .input-group { margin-bottom: 1.2rem; position: relative; }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            padding-right: 45px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.2rem;
        }
        button {
            width: 100%;
            padding: 0.9rem;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: #f97316; text-decoration: none; font-size: 0.85rem; }
        .error-message { color: #dc2626; font-size: 0.8rem; text-align: center; margin-top: 1rem; display: none; }
        .admin-badge { text-align: center; margin-top: 2rem; font-size: 0.7rem; background: #fef3c7; padding: 0.5rem; border-radius: 12px; }
        .admin-badge span { color: #d97706; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>👑 REAGAN'S IT</h1>
            <p>Administrator Login</p>
        </div>
        <form onsubmit="event.preventDefault(); adminLogin();">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="📧 Admin Email" value="jamhurireagan2@gmail.com" required>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="🔒 Password" value="admin123" required>
                <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
            </div>
            <button type="submit">Login as Admin →</button>
        </form>
        <div class="back-link">
            <a href="index.html">← Back to Customer Site</a>
        </div>
        <div id="errorMsg" class="error-message"></div>
        <div class="admin-badge">
            <span>🔐 Secure Admin Portal</span>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBU0Nc6nDv8soHy_MoXyaUQ8fbx-UnLqWI",
            authDomain: "reagan-it-solutions.firebaseapp.com",
            projectId: "reagan-it-solutions",
            storageBucket: "reagan-it-solutions.firebasestorage.app",
            messagingSenderId: "857985673352",
            appId: "1:857985673352:web:5a066de1f543183159173d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function togglePassword() {
            const field = document.getElementById('loginPassword');
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        async function adminLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('errorMsg');
            
            errorDiv.style.display = 'none';
            
            if (!email || !password) {
                errorDiv.textContent = '❌ Please enter email and password';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                // Sign in
                const userCred = await auth.signInWithEmailAndPassword(email, password);
                const uid = userCred.user.uid;
                
                console.log('User signed in with UID:', uid);
                
                // Try to get user by UID first
                let userDoc = await db.collection('users').doc(uid).get();
                
                // If not found by UID, search by email
                if (!userDoc.exists) {
                    console.log('Document not found by UID, searching by email...');
                    const emailQuery = await db.collection('users').where('email', '==', email).get();
                    if (!emailQuery.empty) {
                        userDoc = emailQuery.docs[0];
                        console.log('Found user by email, role:', userDoc.data().role);
                    }
                } else {
                    console.log('Found user by UID, role:', userDoc.data().role);
                }
                
                const userData = userDoc.data();
                
                if (!userData) {
                    errorDiv.textContent = '❌ User data not found in database';
                    errorDiv.style.display = 'block';
                    await auth.signOut();
                    return;
                }
                
                // Check if role is admin
                if (userData.role !== 'admin') {
                    console.log('Role check failed. Found role:', userData.role);
                    errorDiv.textContent = '❌ This account does not have admin privileges. Role: ' + (userData.role || 'none');
                    errorDiv.style.display = 'block';
                    await auth.signOut();
                    return;
                }
                
                console.log('Admin login successful! Redirecting...');
                
                sessionStorage.setItem('userId', uid);
                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('userName', userData.name || 'Admin');
                sessionStorage.setItem('userRole', 'admin');
                
                window.location.href = 'admin-simple.html';
                
            } catch (error) {
                console.error('Login error:', error);
                if (error.code === 'auth/user-not-found') {
                    errorDiv.textContent = '❌ No account found with this email';
                } else if (error.code === 'auth/wrong-password') {
                    errorDiv.textContent = '❌ Incorrect password';
                } else {
                    errorDiv.textContent = '❌ Error: ' + error.message;
                }
                errorDiv.style.display = 'block';
            }
        }
        
        // Debug: Check Firestore data on page load
        async function debugCheck() {
            try {
                const query = await db.collection('users').where('email', '==', 'jamhurireagan2@gmail.com').get();
                if (!query.empty) {
                    const doc = query.docs[0];
                    console.log('Debug - Found admin document:');
                    console.log('- Document ID:', doc.id);
                    console.log('- Role field:', doc.data().role);
                    console.log('- Full data:', doc.data());
                } else {
                    console.log('Debug - No document found for jamhurireagan2@gmail.com');
                }
            } catch(e) {
                console.log('Debug error:', e);
            }
        }
        
        debugCheck();
    </script>
</body>
</html>
