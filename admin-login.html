<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Reagan's IT</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a3a4f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 28px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { color: #f97316; font-size: 1.8rem; }
        .logo p { color: #666; font-size: 0.9rem; }
        .input-group { margin-bottom: 1.2rem; position: relative; }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            padding-right: 45px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.2rem;
        }
        button {
            width: 100%;
            padding: 0.9rem;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: #f97316; text-decoration: none; font-size: 0.85rem; }
        .error-message { color: #dc2626; font-size: 0.8rem; text-align: center; margin-top: 1rem; display: none; }
        .success-message { color: #10b981; font-size: 0.8rem; text-align: center; margin-top: 1rem; display: none; }
        .admin-badge { text-align: center; margin-top: 2rem; font-size: 0.7rem; background: #fef3c7; padding: 0.5rem; border-radius: 12px; }
        .admin-badge span { color: #d97706; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>👑 REAGAN'S IT</h1>
            <p>Administrator Login</p>
        </div>
        <form onsubmit="event.preventDefault(); adminLogin();">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="📧 Admin Email" value="jamhurireagan2@gmail.com" required>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="🔒 Password" required>
                <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
            </div>
            <button type="submit">Login as Admin →</button>
        </form>
        <div class="back-link">
            <a href="index.html">← Back to Customer Site</a>
        </div>
        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>
        <div class="admin-badge">
            <span>🔐 Secure Admin Portal</span>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBU0Nc6nDv8soHy_MoXyaUQ8fbx-UnLqWI",
            authDomain: "reagan-it-solutions.firebaseapp.com",
            projectId: "reagan-it-solutions",
            storageBucket: "reagan-it-solutions.firebasestorage.app",
            messagingSenderId: "857985673352",
            appId: "1:857985673352:web:5a066de1f543183159173d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function togglePassword() {
            const field = document.getElementById('loginPassword');
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        // Function to ensure admin role exists
        async function ensureAdminRole(uid, email) {
            const userDoc = await db.collection('users').doc(uid).get();
            
            if (!userDoc.exists) {
                // Create new admin document
                await db.collection('users').doc(uid).set({
                    name: 'Reagan Admin',
                    email: email,
                    phone: '0113166257',
                    role: 'admin',
                    createdAt: new Date().toISOString()
                });
                console.log('✅ Admin document created');
                return true;
            } else {
                const userData = userDoc.data();
                if (userData.role !== 'admin') {
                    // Update existing user to admin
                    await db.collection('users').doc(uid).update({ role: 'admin' });
                    console.log('✅ User role updated to admin');
                    return true;
                }
                return true;
            }
        }

        async function adminLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            try {
                // Try to sign in
                let userCred;
                try {
                    userCred = await auth.signInWithEmailAndPassword(email, password);
                } catch (signInError) {
                    if (signInError.code === 'auth/user-not-found') {
                        // Create the admin account if it doesn't exist
                        successDiv.textContent = '✅ Creating admin account... Please wait.';
                        successDiv.style.display = 'block';
                        userCred = await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        throw signInError;
                    }
                }
                
                const uid = userCred.user.uid;
                
                // Ensure admin role in Firestore
                await ensureAdminRole(uid, email);
                
                // Verify admin role was set
                const verifyDoc = await db.collection('users').doc(uid).get();
                const userData = verifyDoc.data();
                
                if (userData?.role !== 'admin') {
                    errorDiv.textContent = '❌ Admin role not set correctly. Please try again.';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                sessionStorage.setItem('userId', uid);
                sessionStorage.setItem('userName', userData?.name || email);
                sessionStorage.setItem('userRole', 'admin');
                
                window.location.href = 'admin-simple.html';
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = error.code === 'auth/wrong-password' ? '❌ Incorrect password' : '❌ ' + error.message;
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
