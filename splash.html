<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reagan's IT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f2b3d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .splash {
            text-align: center;
            animation: fadeUp 0.6s ease-out;
            padding: 1rem;
        }
        
        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }
        .logo span { color: #f97316; }
        
        .sub {
            color: #94a3b8;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-top: 0.3rem;
            text-transform: uppercase;
        }
        
        .loader {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 0.7rem;
        }
        .loader span {
            width: 12px;
            height: 12px;
            background: #f97316;
            border-radius: 50%;
            animation: dotBounce 1.2s infinite ease-in-out;
        }
        .loader span:nth-child(2) { animation-delay: 0.15s; }
        .loader span:nth-child(3) { animation-delay: 0.3s; }
        .loader span:nth-child(4) { animation-delay: 0.45s; }
        .loader span:nth-child(5) { animation-delay: 0.6s; }
        
        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .bar {
            width: 180px;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin: 1.8rem auto 0;
            overflow: hidden;
        }
        .bar-fill {
            width: 0%;
            height: 100%;
            background: #f97316;
            border-radius: 4px;
            animation: fillBar 5s ease-in-out forwards;
        }
        
        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .version {
            position: fixed;
            bottom: 24px;
            color: rgba(255,255,255,0.12);
            font-size: 0.6rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo">REAGAN'S <span>IT</span></div>
        <div class="sub">Your Digital Assistant</div>
        
        <div class="loader">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        
        <div class="bar">
            <div class="bar-fill"></div>
        </div>
    </div>
    
    <div class="version">✦ v3.0</div>
    
    <script>
        // Redirect after 5 seconds
        setTimeout(function() {
            window.location.href = '/index.html';
        }, 5000);
    </script>
</body>
</html>
