<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2b3d, #1a3a4f);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .splash-container {
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
        }
        .logo span {
            color: #f97316;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }
        .loader {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }
        .loader span {
            width: 12px;
            height: 12px;
            background: #f97316;
            border-radius: 50%;
            animation: bounce 5.0s infinite ease-in-out;
        }
        .loader span:nth-child(2) { animation-delay: 0.2s; }
        .loader span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">REAGAN'S <span>IT</span></div>
        <div class="subtitle">Your Digital Assistant</div>
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script>
        // Redirect to main page after 2.5 seconds
        setTimeout(() => {
            window.location.href = '/index.html';
        }, 2500);
    </script>
</body>
</html>
