<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Reagan's IT</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a3a4f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated orbs background */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 10s ease-in-out infinite alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: #f97316; top: -10%; right: -10%; }
        .orb-2 { width: 250px; height: 250px; background: #0f2b3d; bottom: -10%; left: -10%; animation-delay: 2s; }
        .orb-3 { width: 180px; height: 180px; background: #ea580c; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; opacity: 0.15; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.1); }
        }

        .login-container {
            background: white;
            padding: 2rem 2rem 2.5rem;
            border-radius: 32px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            z-index: 2;
            animation: containerEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        @keyframes containerEnter {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-container.shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        /* ═══ DANCING CARTOON CHARACTER ═══ */
        .dancer {
            font-size: 5rem;
            display: inline-block;
            margin-bottom: 0.5rem;
            animation: dance 1s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(249, 115, 22, 0.3));
        }

        @keyframes dance {
            0%, 100% { transform: rotate(-10deg) translateY(0) scale(1); }
            25% { transform: rotate(10deg) translateY(-10px) scale(1.05); }
            50% { transform: rotate(-5deg) translateY(0) scale(1); }
            75% { transform: rotate(8deg) translateY(-8px) scale(1.03); }
        }

        /* Musical notes floating up */
        .music-notes {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        .music-notes span {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0;
            animation: floatNote 3s ease-in-out infinite;
        }
        .music-notes span:nth-child(1) { left: 25%; animation-delay: 0s; }
        .music-notes span:nth-child(2) { left: 45%; animation-delay: 0.8s; }
        .music-notes span:nth-child(3) { left: 65%; animation-delay: 1.6s; }
        .music-notes span:nth-child(4) { left: 35%; animation-delay: 2.2s; }

        @keyframes floatNote {
            0% { opacity: 0; transform: translateY(20px) scale(0.5); }
            20% { opacity: 0.8; }
            80% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        .logo h1 { 
            color: #f97316; 
            font-size: 1.6rem;
            animation: logoPulse 2.4s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .logo p { color: #666; font-size: 0.9rem; }

        .input-group { margin-bottom: 1.2rem; position: relative; text-align: left; }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            padding-right: 45px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
            transform: translateY(-2px);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.2rem;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.9rem;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        button[type="submit"]:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
        }
        button[type="submit"]:active {
            transform: translateY(0) scale(0.98);
        }

        button[type="submit"].loading {
            color: transparent;
            pointer-events: none;
        }
        button[type="submit"].loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-link, .register-link { text-align: center; margin-top: 1rem; }
        .forgot-link a, .register-link a {
            color: #f97316;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .forgot-link a:hover, .register-link a:hover { text-decoration: underline; }

        .error-message { 
            color: #dc2626; 
            font-size: 0.8rem; 
            text-align: center; 
            margin-top: 1rem; 
            display: none;
            animation: errorFade 0.3s ease;
        }
        @keyframes errorFade {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-badge { text-align: center; margin-top: 2rem; font-size: 0.7rem; }
        .admin-badge a { color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>
    <!-- Animated Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container" id="loginContainer">
        <!-- ═══ DANCING CARTOON ═══ -->
        <div class="music-notes">
            <span>🎵</span>
            <span>🎶</span>
            <span>🎵</span>
            <span>🎶</span>
        </div>
        <div class="dancer">🕺</div>
        
        <div class="logo">
            <h1>👤 REAGAN'S IT</h1>
            <p>Customer Login</p>
        </div>
        <form onsubmit="event.preventDefault(); userLogin();">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="📧 Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="🔒 Password" required>
                <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
            </div>
            <button type="submit" id="loginBtn">Login as User →</button>
        </form>
        <div class="register-link">
            <a onclick="window.location.href='index.html'">Don't have an account? Register</a>
        </div>
        <div class="error-message" id="errorMsg"></div>
        <div class="admin-badge">
            <a href="admin-login.html">🔐 Admin Login</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBU0Nc6nDv8soHy_MoXyaUQ8fbx-UnLqWI",
            authDomain: "reagan-it-solutions.firebaseapp.com",
            projectId: "reagan-it-solutions",
            storageBucket: "reagan-it-solutions.firebasestorage.app",
            messagingSenderId: "857985673352",
            appId: "1:857985673352:web:5a066de1f543183159173d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function togglePassword() {
            const field = document.getElementById('loginPassword');
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        async function userLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            const container = document.getElementById('loginContainer');
            
            errorDiv.style.display = 'none';

            if (!email || !password) {
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);
                errorDiv.textContent = '❌ Please fill in all fields';
                errorDiv.style.display = 'block';
                return;
            }

            btn.classList.add('loading');
            
            try {
                const userCred = await auth.signInWithEmailAndPassword(email, password);
                const userDoc = await db.collection('users').doc(userCred.user.uid).get();
                const userData = userDoc.data();
                
                sessionStorage.setItem('userId', userCred.user.uid);
                sessionStorage.setItem('userName', userData?.name || email);
                
                window.location.href = 'dashboard.html';
            } catch (error) {
                btn.classList.remove('loading');
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);
                errorDiv.textContent = error.code === 'auth/user-not-found' ? '❌ No account found' : '❌ Invalid email or password';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
