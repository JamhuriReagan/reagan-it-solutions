<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagan's IT Solutions</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .navbar { padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.95); position: fixed; width: 100%; top: 0; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #0f2b3d; }
        .logo span { color: #f97316; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .btn { padding: 0.5rem 1.5rem; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #f97316; color: white; }
        .btn-outline { background: transparent; border: 2px solid #f97316; color: #f97316; }
        .hero { padding: 120px 5% 60px; text-align: center; }
        .hero h1 { font-size: 3rem; color: #0f2b3d; }
        .services-section { padding: 60px 5%; }
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 2rem; color: #f97316; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .service-card { background: white; padding: 1.5rem; border-radius: 15px; text-align: center; cursor: pointer; }
        .service-card:hover { transform: translateY(-5px); }
        .service-icon { font-size: 3rem; }
        .service-price { color: #f97316; font-size: 1.2rem; font-weight: bold; margin: 0.5rem 0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; padding: 2rem; border-radius: 20px; width: 90%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 10px; }
        .close { float: right; font-size: 1.5rem; cursor: pointer; }
        .footer-links { text-align: center; margin-top: 2rem; padding: 1rem; }
        .footer-links a { color: #f97316; text-decoration: none; margin: 0 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">REAGAN'S <span>IT</span></div>
        <div class="nav-links">
            <button class="btn btn-primary" onclick="window.location.href='user-login.html'">Login</button>
            <button class="btn btn-outline" onclick="showRegisterModal()">Register</button>
        </div>
    </nav>

    <section class="hero">
        <h1>🚀 Reagan's IT Solutions</h1>
        <p>Your Digital Assistant – Fast, Reliable, Affordable</p>
        <button class="btn btn-primary" onclick="showRegisterModal()">Get Started →</button>
    </section>

    <section class="services-section">
        <h2 class="section-title">Our Services</h2>
        <div class="services-grid" id="servicesGrid">Loading services...</div>
    </section>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegisterModal()">&times;</span>
            <h2>Create Account 🚀</h2>
            <input type="text" id="regName" placeholder="Full Name">
            <input type="email" id="regEmail" placeholder="Email Address">
            <input type="tel" id="regPhone" placeholder="Phone Number">
            <input type="password" id="regPassword" placeholder="Password (min 6 chars)">
            <input type="password" id="regConfirm" placeholder="Confirm Password">
            <div id="regError" style="color:red; font-size:0.8rem; display:none;"></div>
            <button class="btn btn-primary" onclick="register()" style="width:100%; margin-top:1rem;">Register</button>
        </div>
    </div>

    <div class="footer-links">
        <a href="admin-login.html">🔐 Admin Login</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBU0Nc6nDv8soHy_MoXyaUQ8fbx-UnLqWI",
            authDomain: "reagan-it-solutions.firebaseapp.com",
            projectId: "reagan-it-solutions",
            storageBucket: "reagan-it-solutions.firebasestorage.app",
            messagingSenderId: "857985673352",
            appId: "1:857985673352:web:5a066de1f543183159173d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function showRegisterModal() { document.getElementById('registerModal').style.display = 'flex'; }
        function closeRegisterModal() { document.getElementById('registerModal').style.display = 'none'; }

        async function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const errorDiv = document.getElementById('regError');
            
            if (!name || !email || !phone || !password) {
                errorDiv.textContent = '❌ All fields required'; errorDiv.style.display = 'block'; return;
            }
            if (password !== confirm) { errorDiv.textContent = '❌ Passwords do not match'; errorDiv.style.display = 'block'; return; }
            if (password.length < 6) { errorDiv.textContent = '❌ Password must be at least 6 characters'; errorDiv.style.display = 'block'; return; }
            
            errorDiv.style.display = 'none';
            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(userCred.user.uid).set({
                    name, email, phone, role: 'user', createdAt: new Date().toISOString()
                });
                alert('✅ Registration successful! Please login.');
                closeRegisterModal();
                window.location.href = 'user-login.html';
            } catch (err) {
                errorDiv.textContent = err.code === 'auth/email-already-in-use' ? '❌ Email already registered' : '❌ ' + err.message;
                errorDiv.style.display = 'block';
            }
        }

        async function loadServices() {
            const grid = document.getElementById('servicesGrid');
            try {
                const snapshot = await db.collection('services').orderBy('id').get();
                let services = [];
                if (snapshot.empty) {
                    services = [
                        { id: 1, name: "CV & Cover Letter", icon: "📄", price: 500 },
                        { id: 2, name: "KRA PIN Registration", icon: "🔖", price: 300 },
                        { id: 3, name: "KRA Returns Filing", icon: "📊", price: 500 },
                        { id: 4, name: "SHA Enrollment", icon: "🛡️", price: 200 },
                        { id: 5, name: "Typing & Printing", icon: "🖨️", price: 50 },
                        { id: 6, name: "Data Entry", icon: "📊", price: 1000 },
                        { id: 7, name: "Passport Photos", icon: "🖼️", price: 200 },
                        { id: 8, name: "Computer Training", icon: "💻", price: 2000 },
                        { id: 9, name: "Email Setup", icon: "📧", price: 300 },
                        { id: 10, name: "PDF Conversion", icon: "🔐", price: 100 }
                    ];
                    for (const s of services) await db.collection('services').doc(s.id.toString()).set(s);
                } else {
                    snapshot.forEach(doc => services.push(doc.data()));
                }
                grid.innerHTML = services.map(s => `
                    <div class="service-card">
                        <div class="service-icon">${s.icon}</div>
                        <h3>${s.name}</h3>
                        <div class="service-price">KES ${s.price.toLocaleString()}</div>
                        <button class="btn btn-outline" onclick="window.location.href='user-login.html'">Login to Request</button>
                    </div>
                `).join('');
            } catch(e) { grid.innerHTML = '<p>Error loading services. Refresh.</p>'; }
        }
        
        loadServices();
    </script>
</body>
</html>
